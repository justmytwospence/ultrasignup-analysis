# Analysis environment for UltraSignup race data
# Install dependencies with: uv pip install -r pyproject.toml

[project]
name = "ultrasignup-analysis"
version = "0.1.0"
description = "Statistical analysis and modeling for UltraSignup race data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pymc>=5.6.1",
    "arviz>=0.22.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.2",
    "plotly>=5.18.0",
    "scipy>=1.11.0",
    "graphviz>=0.20.3",
    "ipywidgets>=8.1.7",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "jax-metal>=0.1.0",
    "jax>=0.8.0",
    "numpyro>=0.19.0",
    "pymc-extras>=0.5.0",
    "networkx>=3.0",
    "qrcode[pil]>=8.2",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "blackjax>=1.3",
]

# Note: jax-metal enables GPU acceleration on Apple Silicon Macs
# For NVIDIA GPUs, use "jax[cuda12]>=0.8.0" instead
