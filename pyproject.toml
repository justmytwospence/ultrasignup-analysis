[project]
name = "ultrasignup-analysis"
version = "0.1.0"
description = "Bayesian models of ultramarathon finish times and DNFs, over the UltraSignup mirror"
requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.*",
    "python-dotenv>=1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pymc>=5.6.1",
    "arviz>=0.22.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.2",
    "plotly>=5.18.0",
    "scipy>=1.11.0",
    "graphviz>=0.20.3",
    "ipywidgets>=8.1.7",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "jax-metal>=0.1.0",
    "jax>=0.8.0",
    "numpyro>=0.19.0",
    "pymc-extras>=0.5.0",
    "networkx>=3.0",
    "qrcode[pil]>=8.2",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "blackjax>=1.3",
    "igraph>=1.0.0",
    "marimo>=0.25.1",
    "marimo-lens>=0.2.4",
    "nutpie>=0.16.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.uv]
# Release cooldown: resolve only releases at least a week old. duckdb 2.0.0 (2026-10-21) is
# taken early on purpose: the mirror writes DuckDB 2.0 storage and Quack needs the same
# version on both ends. Remove the entry once it is past the cooldown.
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
duckdb = "2026-10-21T13:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the real mirror (ULTRASIGNUP_QUACK_URI and ULTRASIGNUP_QUACK_TOKEN)"]
addopts = "-m 'not live'"

[tool.marimo.runtime]
# 0_kcore.py's 3D wireframe carries 9 toggle states (3 z-axes × 3 colors)
# which serializes to ~24MB. Override the 8MB user-config default
# (~/.config/marimo/marimo.toml) for this project.
output_max_bytes = 40_000_000

# Note: jax-metal enables GPU acceleration on Apple Silicon Macs
# For NVIDIA GPUs, use "jax[cuda12]>=0.8.0" instead
